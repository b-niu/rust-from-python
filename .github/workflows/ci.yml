name: Rust & Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-check-and-test:
    name: Rust Workspace Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo Check
        run: cargo check --workspace --all-targets
      - name: Cargo Test
        run: cargo test --workspace

  python-maturin-build:
    name: PyO3 Maturin Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Maturin & NumPy
        run: pip install maturin numpy
      - name: Maturin Build Wheel
        run: maturin build --release
